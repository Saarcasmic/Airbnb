<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Block Dates | Pyari Kunj Vrindavan</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#341320">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
@font-face{font-family:'Marcellus';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/marcellus-latin.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/hanken-grotesk-latin.woff2) format('woff2')}
*,*::before,*::after{box-sizing:border-box}
:root{
  --velvet:#341320; --ink:#271821; --ink-soft:#503B47; --mut:#6E5A64;
  --marble:#F5F3F1; --card:#FFFDFE;
  --rani:#A61E4D; --rani-deep:#87173D; --rani-tint:#F6E2EA;
  --leaf:#0E7C43; --leaf-tint:#E4F3EA;
  --error:#B3261E; --error-tint:#FBE9E7;
  --hairline:rgba(39,24,33,0.14);
  --serif:'Marcellus',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
}
body{
  margin:0; min-height:100vh; background:var(--marble); color:var(--ink);
  font-family:var(--sans); line-height:1.5;
}
.shell{ max-width:520px; margin:0 auto; padding:28px 18px 80px; }
h1{ font-family:var(--serif); font-size:26px; margin:0 0 4px; color:var(--velvet); }
.sub{ color:var(--mut); font-size:14px; margin:0 0 24px; }

/* ---- gate ---- */
#gate{ display:flex; flex-direction:column; align-items:center; padding-top:18vh; text-align:center; }
#gate .lock{ font-size:32px; margin-bottom:10px; }
#gateForm{ width:100%; max-width:320px; margin-top:18px; display:flex; flex-direction:column; gap:10px; }
input[type="password"], input[type="date"]{
  font:inherit; padding:13px 14px; border-radius:12px; border:1px solid var(--hairline);
  background:var(--card); color:var(--ink); width:100%;
}
input:focus{ outline:2px solid var(--rani); outline-offset:1px; }
.btn{
  font:inherit; font-weight:700; font-size:15px; padding:13px 18px; border-radius:999px;
  border:none; cursor:pointer; background:var(--velvet); color:#fff; width:100%;
}
.btn:active{ opacity:0.85; }
.btn-outline{
  background:transparent; color:var(--velvet); border:1.5px solid var(--velvet);
}
.btn-danger{ background:var(--error); }
.err{ color:var(--error); font-size:13.5px; min-height:18px; margin:0; }

/* ---- app ---- */
#app{ display:none; }
.toolbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
.toolbar .btn{ width:auto; }

#blockForm{
  display:none; background:var(--card); border:1px solid var(--hairline); border-radius:16px;
  padding:16px; margin-bottom:18px; gap:10px; flex-direction:column;
}
#blockForm .row{ display:flex; gap:10px; }
#blockForm label{ font-size:12.5px; color:var(--mut); display:block; margin-bottom:4px; }
#blockForm .field{ flex:1; }
#blockForm .actions{ display:flex; gap:10px; margin-top:4px; }
#blockForm .actions .btn{ flex:1; }

#list{ display:flex; flex-direction:column; gap:10px; }
.card{
  background:var(--card); border:1px solid var(--hairline); border-radius:16px;
  padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px;
}
.card-main{ min-width:0; }
.card-dates{ font-weight:700; font-size:15.5px; color:var(--ink); }
.card-meta{ font-size:12.5px; color:var(--mut); margin-top:2px; }
.tag{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.03em;
  text-transform:uppercase; padding:2px 8px; border-radius:999px; margin-right:6px;
}
.tag-booking{ background:var(--rani-tint); color:var(--rani-deep); }
.tag-manual{ background:var(--leaf-tint); color:var(--leaf); }
.card .btn{ width:auto; flex-shrink:0; padding:10px 14px; font-size:13.5px; background:transparent; color:var(--error); border:1.5px solid var(--error); }

.empty, .loading{ color:var(--mut); text-align:center; padding:40px 0; font-size:14.5px; }
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--velvet); color:#fff; padding:11px 18px; border-radius:999px;
  font-size:13.5px; opacity:0; transition:opacity 0.2s; pointer-events:none; white-space:nowrap;
}
.toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="shell">
  <div id="gate">
    <div class="lock" aria-hidden="true">🔒</div>
    <h1>Block Dates</h1>
    <p class="sub">Pyari Kunj Vrindavan — host only</p>
    <form id="gateForm">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password" autofocus>
      <p class="err" id="gateErr"></p>
      <button type="submit" class="btn">Enter</button>
    </form>
  </div>

  <div id="app">
    <h1>Blocked dates</h1>
    <p class="sub">Pyari Kunj Vrindavan</p>

    <div class="toolbar">
      <button type="button" class="btn btn-outline" id="toggleFormBtn">+ Block dates</button>
      <button type="button" class="btn btn-outline" id="refreshBtn" style="width:44px;padding:10px" aria-label="Refresh">⟳</button>
    </div>

    <form id="blockForm">
      <div class="row">
        <div class="field">
          <label for="startInput">Check-in</label>
          <input type="date" id="startInput" required>
        </div>
        <div class="field">
          <label for="endInput">Check-out</label>
          <input type="date" id="endInput" required>
        </div>
      </div>
      <p class="err" id="formErr"></p>
      <div class="actions">
        <button type="button" class="btn btn-outline" id="cancelFormBtn">Cancel</button>
        <button type="submit" class="btn">Block</button>
      </div>
    </form>

    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
var PW_KEY = 'pk_admin_pw';
var el = {
  gate: document.getElementById('gate'),
  app: document.getElementById('app'),
  gateForm: document.getElementById('gateForm'),
  pwInput: document.getElementById('pwInput'),
  gateErr: document.getElementById('gateErr'),
  toggleFormBtn: document.getElementById('toggleFormBtn'),
  refreshBtn: document.getElementById('refreshBtn'),
  blockForm: document.getElementById('blockForm'),
  startInput: document.getElementById('startInput'),
  endInput: document.getElementById('endInput'),
  formErr: document.getElementById('formErr'),
  cancelFormBtn: document.getElementById('cancelFormBtn'),
  list: document.getElementById('list'),
  toast: document.getElementById('toast')
};

function showToast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
}

function fmtDate(iso) {
  var d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function api(method, path, body) {
  var pw = sessionStorage.getItem(PW_KEY) || '';
  return fetch(path, {
    method: method,
    headers: Object.assign({ 'X-Admin-Password': pw }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    if (r.status === 401) { onAuthFail(); throw new Error('unauthorized'); }
    return r.json().then(function (data) {
      if (!r.ok) throw new Error((data && data.error) || 'request_failed');
      return data;
    });
  });
}

function onAuthFail() {
  sessionStorage.removeItem(PW_KEY);
  el.app.style.display = 'none';
  el.gate.style.display = 'flex';
  el.gateErr.textContent = 'Wrong password.';
}

function renderList(rows) {
  el.list.innerHTML = '';
  if (!rows.length) {
    el.list.innerHTML = '<p class="empty">No blocked dates right now.</p>';
    return;
  }
  rows.forEach(function (row) {
    var card = document.createElement('div');
    card.className = 'card';
    var tag = row.source === 'manual'
      ? '<span class="tag tag-manual">Manual</span>'
      : '<span class="tag tag-booking">Booking</span>';
    card.innerHTML =
      '<div class="card-main">' +
        '<div class="card-dates">' + fmtDate(row.start_date) + ' → ' + fmtDate(row.end_date) + '</div>' +
        '<div class="card-meta">' + tag + (row.reservation_ref ? row.reservation_ref : '') + '</div>' +
      '</div>' +
      '<button type="button" class="btn" data-id="' + row.id + '">Open</button>';
    card.querySelector('button').addEventListener('click', function () { openDates(row.id, card); });
    el.list.appendChild(card);
  });
}

function loadList() {
  el.list.innerHTML = '<p class="loading">Loading…</p>';
  api('GET', '/api/admin/blocks').then(renderList).catch(function (e) {
    if (e.message !== 'unauthorized') el.list.innerHTML = '<p class="empty">Couldn’t load — try refreshing.</p>';
  });
}

function openDates(id, card) {
  if (!confirm('Open these dates back up? This removes the block.')) return;
  api('DELETE', '/api/admin/blocks', { id: id }).then(function () {
    card.remove();
    showToast('Dates opened');
    if (!el.list.children.length) el.list.innerHTML = '<p class="empty">No blocked dates right now.</p>';
  }).catch(function (e) {
    if (e.message !== 'unauthorized') showToast('Could not open those dates');
  });
}

el.gateForm.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var pw = el.pwInput.value;
  if (!pw) return;
  sessionStorage.setItem(PW_KEY, pw);
  el.gateErr.textContent = '';
  api('GET', '/api/admin/blocks').then(function (rows) {
    el.gate.style.display = 'none';
    el.app.style.display = 'block';
    renderList(rows);
  }).catch(function (e) {
    if (e.message === 'unauthorized') el.gateErr.textContent = 'Wrong password.';
    else el.gateErr.textContent = 'Something went wrong — try again.';
  });
});

el.toggleFormBtn.addEventListener('click', function () {
  var showing = el.blockForm.style.display === 'flex';
  el.blockForm.style.display = showing ? 'none' : 'flex';
  el.formErr.textContent = '';
});
el.cancelFormBtn.addEventListener('click', function () {
  el.blockForm.style.display = 'none';
  el.blockForm.reset();
  el.formErr.textContent = '';
});
el.refreshBtn.addEventListener('click', loadList);

el.blockForm.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var start = el.startInput.value, end = el.endInput.value;
  if (!start || !end) return;
  if (end <= start) { el.formErr.textContent = 'Check-out must be after check-in.'; return; }
  el.formErr.textContent = '';
  api('POST', '/api/admin/blocks', { start_date: start, end_date: end }).then(function () {
    el.blockForm.style.display = 'none';
    el.blockForm.reset();
    showToast('Dates blocked');
    loadList();
  }).catch(function (e) {
    if (e.message !== 'unauthorized') el.formErr.textContent = 'Could not block those dates — try again.';
  });
});

// Already unlocked this session?
if (sessionStorage.getItem(PW_KEY)) {
  api('GET', '/api/admin/blocks').then(function (rows) {
    el.gate.style.display = 'none';
    el.app.style.display = 'block';
    renderList(rows);
  }).catch(function () { /* onAuthFail already handled the 401 case */ });
}
</script>
</body>
</html>

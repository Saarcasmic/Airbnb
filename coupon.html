<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Coupons | Pyari Kunj Vrindavan</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#341320">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
@font-face{font-family:'Marcellus';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/marcellus-latin.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/hanken-grotesk-latin.woff2) format('woff2')}
*,*::before,*::after{box-sizing:border-box}
:root{
  --velvet:#341320; --ink:#271821; --ink-soft:#503B47; --mut:#6E5A64;
  --marble:#F5F3F1; --card:#FFFDFE;
  --rani:#A61E4D; --rani-deep:#87173D; --rani-tint:#F6E2EA;
  --leaf:#0E7C43; --leaf-tint:#E4F3EA;
  --brass:#B7892F; --brass-tint:#FBF1DC;
  --error:#B3261E; --error-tint:#FBE9E7;
  --hairline:rgba(39,24,33,0.14);
  --serif:'Marcellus',Georgia,serif;
  --sans:'Hanken Grotesk',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
}
body{
  margin:0; min-height:100vh; background:var(--marble); color:var(--ink);
  font-family:var(--sans); line-height:1.5;
}
.shell{ max-width:520px; margin:0 auto; padding:28px 18px 80px; }
h1{ font-family:var(--serif); font-size:26px; margin:0 0 4px; color:var(--velvet); }
.sub{ color:var(--mut); font-size:14px; margin:0 0 24px; }

/* ---- gate ---- */
#gate{ display:flex; flex-direction:column; align-items:center; padding-top:18vh; text-align:center; }
#gate .lock{ font-size:32px; margin-bottom:10px; }
#gateForm{ width:100%; max-width:320px; margin-top:18px; display:flex; flex-direction:column; gap:10px; }
input[type="password"], input[type="text"], input[type="number"]{
  font:inherit; padding:13px 14px; border-radius:12px; border:1px solid var(--hairline);
  background:var(--card); color:var(--ink); width:100%;
}
input:focus{ outline:2px solid var(--rani); outline-offset:1px; }
#codeInput{ text-transform:uppercase; letter-spacing:0.06em; font-weight:700; }
.btn{
  font:inherit; font-weight:700; font-size:15px; padding:13px 18px; border-radius:999px;
  border:none; cursor:pointer; background:var(--velvet); color:#fff; width:100%;
}
.btn:active{ opacity:0.85; }
.btn-outline{ background:transparent; color:var(--velvet); border:1.5px solid var(--velvet); }
.err{ color:var(--error); font-size:13.5px; min-height:18px; margin:0; }

/* ---- app ---- */
#app{ display:none; }
.toolbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
.toolbar .btn{ width:auto; }
.nav-link{ font-size:13px; color:var(--mut); text-decoration:underline; text-underline-offset:3px; }

#couponForm{
  display:none; background:var(--card); border:1px solid var(--hairline); border-radius:16px;
  padding:16px; margin-bottom:18px; gap:10px; flex-direction:column;
}
#couponForm .row{ display:flex; gap:10px; }
#couponForm label{ font-size:12.5px; color:var(--mut); display:block; margin-bottom:4px; }
#couponForm .field{ flex:1; }
#couponForm .field.pct{ max-width:110px; }
#couponForm .actions{ display:flex; gap:10px; margin-top:4px; }
#couponForm .actions .btn{ flex:1; }
.check{ display:flex; align-items:flex-start; gap:9px; font-size:13.5px; color:var(--ink-soft); cursor:pointer; }
.check input{ margin:3px 0 0; width:17px; height:17px; accent-color:var(--rani); flex-shrink:0; }
.check span small{ display:block; color:var(--mut); font-size:12px; }

#list{ display:flex; flex-direction:column; gap:10px; }
.card{
  background:var(--card); border:1px solid var(--hairline); border-radius:16px; padding:14px 16px;
}
.card.is-paused{ opacity:0.62; }
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.card-code{ font-weight:700; font-size:18px; letter-spacing:0.06em; color:var(--ink); font-family:var(--sans); }
.card-meta{ font-size:12.5px; color:var(--mut); margin-top:3px; }
.card-pct{
  font-family:var(--serif); font-size:24px; color:var(--rani); white-space:nowrap; line-height:1.1;
}
.tags{ margin-top:8px; }
.tag{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:0.03em;
  text-transform:uppercase; padding:2px 8px; border-radius:999px; margin-right:6px;
}
.tag-live{ background:var(--brass-tint); color:#8A6614; }
.tag-paused{ background:var(--error-tint); color:var(--error); }
.tag-active{ background:var(--leaf-tint); color:var(--leaf); }
.card-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.card-actions button{
  font:inherit; font-size:13px; font-weight:700; padding:8px 13px; border-radius:999px;
  border:1.5px solid var(--hairline); background:transparent; color:var(--ink-soft); cursor:pointer;
}
.card-actions button.primary{ border-color:var(--rani); color:var(--rani); }
.card-actions button.danger{ border-color:var(--error); color:var(--error); margin-left:auto; }

.empty, .loading{ color:var(--mut); text-align:center; padding:40px 0; font-size:14.5px; }
.hint{ font-size:12.5px; color:var(--mut); margin:0 0 18px; line-height:1.55; }
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--velvet); color:#fff; padding:11px 18px; border-radius:999px;
  font-size:13.5px; opacity:0; transition:opacity 0.2s; pointer-events:none; white-space:nowrap;
}
.toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="shell">
  <div id="gate">
    <div class="lock" aria-hidden="true">🎟️</div>
    <h1>Coupons</h1>
    <p class="sub">Pyari Kunj Vrindavan — host only</p>
    <form id="gateForm">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password" autofocus>
      <p class="err" id="gateErr"></p>
      <button type="submit" class="btn">Enter</button>
    </form>
  </div>

  <div id="app">
    <h1>Coupons</h1>
    <p class="sub">Pyari Kunj Vrindavan · <a class="nav-link" href="/block">Blocked dates →</a></p>

    <p class="hint">
      Guests pay the full ₹2,499 per night unless they apply a coupon.
      Mark one coupon <strong>“Show on site”</strong> and its code appears in the
      festive banner on the homepage, ready to apply in one tap.
    </p>

    <div class="toolbar">
      <button type="button" class="btn btn-outline" id="toggleFormBtn">+ New coupon</button>
      <button type="button" class="btn btn-outline" id="refreshBtn" style="width:44px;padding:10px" aria-label="Refresh">⟳</button>
    </div>

    <form id="couponForm">
      <div class="row">
        <div class="field">
          <label for="codeInput">Code</label>
          <input type="text" id="codeInput" placeholder="FESTIVE10" autocapitalize="characters"
                 autocomplete="off" spellcheck="false" maxlength="24" required>
        </div>
        <div class="field pct">
          <label for="pctInput">% off</label>
          <input type="number" id="pctInput" min="1" max="99" step="1" placeholder="10" required>
        </div>
      </div>
      <div class="field">
        <label for="labelInput">Banner label</label>
        <input type="text" id="labelInput" placeholder="Festive offer" maxlength="40">
      </div>
      <label class="check">
        <input type="checkbox" id="featuredInput">
        <span>Show on site
          <small>Puts this code in the homepage banner. Only one coupon can be shown at a time.</small>
        </span>
      </label>
      <p class="err" id="formErr"></p>
      <div class="actions">
        <button type="button" class="btn btn-outline" id="cancelFormBtn">Cancel</button>
        <button type="submit" class="btn">Create</button>
      </div>
    </form>

    <div id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
// Same session key as /block — one host password unlocks both pages.
var PW_KEY = 'pk_admin_pw';
var el = {
  gate: document.getElementById('gate'),
  app: document.getElementById('app'),
  gateForm: document.getElementById('gateForm'),
  pwInput: document.getElementById('pwInput'),
  gateErr: document.getElementById('gateErr'),
  toggleFormBtn: document.getElementById('toggleFormBtn'),
  refreshBtn: document.getElementById('refreshBtn'),
  couponForm: document.getElementById('couponForm'),
  codeInput: document.getElementById('codeInput'),
  pctInput: document.getElementById('pctInput'),
  labelInput: document.getElementById('labelInput'),
  featuredInput: document.getElementById('featuredInput'),
  formErr: document.getElementById('formErr'),
  cancelFormBtn: document.getElementById('cancelFormBtn'),
  list: document.getElementById('list'),
  toast: document.getElementById('toast')
};

function showToast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
}

function api(method, path, body) {
  var pw = sessionStorage.getItem(PW_KEY) || '';
  return fetch(path, {
    method: method,
    headers: Object.assign({ 'X-Admin-Password': pw }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    if (r.status === 401) { onAuthFail(); throw new Error('unauthorized'); }
    return r.json().then(function (data) {
      if (!r.ok) throw new Error((data && data.error) || 'request_failed');
      return data;
    });
  });
}

function onAuthFail() {
  sessionStorage.removeItem(PW_KEY);
  el.app.style.display = 'none';
  el.gate.style.display = 'flex';
  el.gateErr.textContent = 'Wrong password.';
}

function nightlyWith(pct) {
  var now = Math.round(2499 * (1 - pct / 100));
  return '₹' + now.toLocaleString('en-IN') + ' / night';
}

function copyCode(code) {
  var done = function () { showToast('Code ' + code + ' copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(function () { showToast(code); });
  } else { showToast(code); }
}

function renderList(rows) {
  el.list.innerHTML = '';
  if (!rows.length) {
    el.list.innerHTML = '<p class="empty">No coupons yet. Create one to start sharing offers.</p>';
    return;
  }
  rows.forEach(function (row) {
    var card = document.createElement('div');
    card.className = 'card' + (row.active ? '' : ' is-paused');

    var tags = '';
    if (row.featured && row.active) tags += '<span class="tag tag-live">On site banner</span>';
    tags += row.active
      ? '<span class="tag tag-active">Active</span>'
      : '<span class="tag tag-paused">Paused</span>';

    card.innerHTML =
      '<div class="card-top">' +
        '<div>' +
          '<div class="card-code"></div>' +
          '<div class="card-meta"></div>' +
        '</div>' +
        '<div class="card-pct">' + row.percent_off + '%</div>' +
      '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '<div class="card-actions">' +
        '<button type="button" data-act="copy">Copy</button>' +
        '<button type="button" data-act="feature"' + (row.active ? '' : ' disabled') + '>' +
          (row.featured ? 'Hide from site' : 'Show on site') + '</button>' +
        '<button type="button" data-act="toggle">' + (row.active ? 'Pause' : 'Resume') + '</button>' +
        '<button type="button" class="danger" data-act="delete">Delete</button>' +
      '</div>';

    // textContent (not innerHTML) for host-entered values — no markup injection.
    card.querySelector('.card-code').textContent = row.code;
    card.querySelector('.card-meta').textContent = (row.label || 'Festive offer') + ' · ' + nightlyWith(row.percent_off);

    card.querySelector('[data-act="copy"]').addEventListener('click', function () { copyCode(row.code); });
    card.querySelector('[data-act="feature"]').addEventListener('click', function () {
      api('PATCH', '/api/admin/coupons', { id: row.id, featured: !row.featured })
        .then(function () {
          showToast(row.featured ? 'Removed from banner' : 'Now showing on site');
          loadList();
        })
        .catch(function (e) { if (e.message !== 'unauthorized') showToast('Could not update'); });
    });
    card.querySelector('[data-act="toggle"]').addEventListener('click', function () {
      api('PATCH', '/api/admin/coupons', { id: row.id, active: !row.active })
        .then(function () { showToast(row.active ? 'Coupon paused' : 'Coupon resumed'); loadList(); })
        .catch(function (e) { if (e.message !== 'unauthorized') showToast('Could not update'); });
    });
    card.querySelector('[data-act="delete"]').addEventListener('click', function () {
      if (!confirm('Delete ' + row.code + '? Guests who have the code will no longer be able to use it.')) return;
      api('DELETE', '/api/admin/coupons', { id: row.id })
        .then(function () { showToast('Coupon deleted'); loadList(); })
        .catch(function (e) { if (e.message !== 'unauthorized') showToast('Could not delete'); });
    });

    el.list.appendChild(card);
  });
}

function loadList() {
  el.list.innerHTML = '<p class="loading">Loading…</p>';
  api('GET', '/api/admin/coupons').then(renderList).catch(function (e) {
    if (e.message !== 'unauthorized') el.list.innerHTML = '<p class="empty">Couldn’t load — try refreshing.</p>';
  });
}

el.gateForm.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var pw = el.pwInput.value;
  if (!pw) return;
  sessionStorage.setItem(PW_KEY, pw);
  el.gateErr.textContent = '';
  api('GET', '/api/admin/coupons').then(function (rows) {
    el.gate.style.display = 'none';
    el.app.style.display = 'block';
    renderList(rows);
  }).catch(function (e) {
    if (e.message === 'unauthorized') el.gateErr.textContent = 'Wrong password.';
    else el.gateErr.textContent = 'Something went wrong — try again.';
  });
});

el.toggleFormBtn.addEventListener('click', function () {
  var showing = el.couponForm.style.display === 'flex';
  el.couponForm.style.display = showing ? 'none' : 'flex';
  el.formErr.textContent = '';
  if (!showing) el.codeInput.focus();
});
el.cancelFormBtn.addEventListener('click', function () {
  el.couponForm.style.display = 'none';
  el.couponForm.reset();
  el.formErr.textContent = '';
});
el.refreshBtn.addEventListener('click', loadList);

el.couponForm.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var code = (el.codeInput.value || '').replace(/\s+/g, '').toUpperCase();
  var pct = parseInt(el.pctInput.value, 10);
  if (!/^[A-Z0-9][A-Z0-9_-]{1,23}$/.test(code)) {
    el.formErr.textContent = 'Code: 2–24 letters, numbers, - or _ (no spaces).';
    return;
  }
  if (!(pct > 0 && pct <= 99)) { el.formErr.textContent = 'Percentage must be between 1 and 99.'; return; }
  el.formErr.textContent = '';
  api('POST', '/api/admin/coupons', {
    code: code,
    percent_off: pct,
    label: el.labelInput.value || '',
    featured: el.featuredInput.checked
  }).then(function () {
    el.couponForm.style.display = 'none';
    el.couponForm.reset();
    showToast('Coupon ' + code + ' created');
    loadList();
  }).catch(function (e) {
    if (e.message === 'unauthorized') return;
    el.formErr.textContent = e.message === 'duplicate_code'
      ? 'That code already exists.'
      : 'Could not create the coupon — try again.';
  });
});

// Already unlocked this session?
if (sessionStorage.getItem(PW_KEY)) {
  api('GET', '/api/admin/coupons').then(function (rows) {
    el.gate.style.display = 'none';
    el.app.style.display = 'block';
    renderList(rows);
  }).catch(function () { /* onAuthFail already handled the 401 case */ });
}
</script>
</body>
</html>
